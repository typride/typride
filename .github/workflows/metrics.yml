name: Metrics
on:
  schedule: [{cron: "0 13 * * *"}]   # 06:00 Pacific daily
  workflow_dispatch:
  push: {branches: [main]}
concurrency:
  group: metrics
  cancel-in-progress: true
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: typride
          filename: github-metrics.svg
          template: classic
          config_display: large
          config_timezone: America/Los_Angeles
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_forks: no
          commits_authoring: typride, tylerpridemilligan@gmail.com, tyler pride milligan
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 2
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: jupyter notebook
